
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELITA CMMS</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0f172a;
    }
  </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center">

  <div class="bg-slate-800 p-10 rounded-2xl shadow-2xl w-full max-w-md">

    <h1 class="text-4xl font-bold mb-3">
      ELITA CMMS
    </h1>

    <p class="text-slate-300 mb-8">
      System zgłoszeń awarii i usterek
    </p>

    <form id="loginForm" class="space-y-4">

      <input
        type="email"
        id="email"
        placeholder="Email"
        class="w-full p-4 rounded bg-slate-700"
        required
      >

      <input
        type="text"
        id="phone"
        placeholder="Numer telefonu"
        class="w-full p-4 rounded bg-slate-700"
        required
      >

      <button
        type="submit"
        class="w-full bg-orange-500 hover:bg-orange-600 p-4 rounded font-bold"
      >
        Zaloguj / Zarejestruj
      </button>

    </form>

    <div id="status" class="mt-6 text-green-400"></div>

  </div>

  <script type="module" src="./js/auth.js"></script>

</body>
</html>
