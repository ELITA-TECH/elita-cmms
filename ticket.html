
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zgłoszenie</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white p-8">

  <div class="max-w-3xl mx-auto bg-slate-800 p-8 rounded-2xl">

    <h1 class="text-3xl font-bold mb-6">
      Nowe zgłoszenie
    </h1>

    <form id="ticketForm" class="space-y-4">

      <input
        id="machine_name"
        placeholder="Maszyna / urządzenie"
        class="w-full p-4 rounded bg-slate-700"
      >

      <textarea
        id="description"
        placeholder="Opis problemu"
        class="w-full p-4 rounded bg-slate-700 h-40"
      ></textarea>

      <select
        id="priority"
        class="w-full p-4 rounded bg-slate-700"
      >
        <option>ważne</option>
        <option>tylko porada</option>
        <option>pilny serwis</option>
      </select>

      <input
        id="address"
        placeholder="Adres"
        class="w-full p-4 rounded bg-slate-700"
      >

      <div class="grid grid-cols-2 gap-4">

        <input
          id="postal_code"
          placeholder="Kod pocztowy"
          class="w-full p-4 rounded bg-slate-700"
        >

        <input
          id="city"
          placeholder="Miasto"
          class="w-full p-4 rounded bg-slate-700"
        >

      </div>

      <button
        class="w-full bg-orange-500 hover:bg-orange-600 p-4 rounded font-bold"
      >
        Wyślij zgłoszenie
      </button>

    </form>

    <div id="result" class="mt-6 text-green-400"></div>

  </div>

  <script type="module" src="./js/ticket.js"></script>

</body>
</html>
